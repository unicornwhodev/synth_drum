name: Multiplatform release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Standalone and VST3
        shell: pwsh
        run: .\_build_all.ps1 -Configuration Release -BuildDir build -BootstrapJuce
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Package Windows
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\_package_inno.ps1 -Configuration Release -BuildDir build -SkipBuild -AppVersion $version
          $root = 'build\UWdeVST_drum_artefacts\Release'
          New-Item -ItemType Directory -Path package\Standalone,package\VST3 -Force | Out-Null
          Copy-Item "$root\Standalone\*.exe" package\Standalone
          Copy-Item "$root\VST3\*.vst3" package\VST3 -Recurse
          Compress-Archive package\* "UWdeVST_Drum_${version}_Windows_x64.zip"
          Copy-Item "installer\output\uwdevst_drum_${version}_Windows_x64_Setup.exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            UWdeVST_Drum_*_Windows_x64.zip
            uwdevst_drum_*_Windows_x64_Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev
      - name: Build and validate Linux
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          cmake -S synth_drum -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --parallel 4
          root=build-linux/UWdeVST_drum_artefacts/Release
          standalone=$(find "$root/Standalone" -maxdepth 1 -type f -print -quit)
          vst3_bundle=$(find "$root/VST3" -maxdepth 1 -type d -name '*.vst3' -print -quit)
          vst3_binary=$(find "$vst3_bundle/Contents" -type f -name '*.so' -print -quit)
          test -n "$standalone" && test -n "$vst3_binary"
          file "$standalone" "$vst3_binary" | grep 'ELF 64-bit.*x86-64'
          ! ldd "$standalone" | grep -q 'not found'
          ! ldd "$vst3_binary" | grep -q 'not found'
          nm -D "$vst3_binary" | grep -q GetPluginFactory
          package="UWdeVST_Drum_${version}_Linux_x86_64"
          mkdir -p "$package/Standalone" "$package/VST3"
          cp -a "$standalone" "$package/Standalone/"
          cp -a "$vst3_bundle" "$package/VST3/"
          printf 'Version=%s\nSourceCommit=%s\nPlatform=Linux x86_64\nFormats=Standalone,VST3\n' "$version" "$GITHUB_SHA" > "$package/BUILD_INFO.txt"
          tar -czf "$package.tar.gz" "$package"
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            UWdeVST_Drum_*_Linux_x86_64.tar.gz
            UWdeVST_Drum_*_Linux_x86_64.tar.gz.sha256
          if-no-files-found: error

  macos-builder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          submodules: recursive
          path: _juce
      - name: Assemble self-contained macOS Universal builder
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="UWdeVST_Drum_${version}_macOS_Builder"
          mkdir -p "$package/source" "$package/cmake" "$package/assets"
          cp -a synth_drum/. "$package/source/"
          cp -a 'new composants' Shared "$package/"
          cp -a 'assets versions png'/. "$package/assets/"
          cp -a _juce "$package/JUCE"
          cp packaging/macos-builder/BUILD_MAC.command "$package/"
          cp packaging/macos-builder/README.txt "$package/"
          cp packaging/macos-builder/enable-c.cmake "$package/cmake/"
          chmod +x "$package/BUILD_MAC.command"
          juce_commit=$(git -C _juce rev-parse HEAD)
          printf 'PRODUCT_NAME="UWdeVST_Drum"\nPRODUCT_SLUG="drum"\nPRODUCT_VERSION="%s"\nSOURCE_COMMIT="%s"\nSOURCE_STATE="clean"\nSOURCE_DIFF_SHA256="none"\nJUCE_COMMIT="%s"\n' "$version" "$GITHUB_SHA" "$juce_commit" > "$package/builder.conf"
          (cd "$package" && find . -type f ! -name PACKAGE_SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > PACKAGE_SHA256SUMS)
          tar -czf "$package.tar.gz" "$package"
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-builder-release
          path: |
            UWdeVST_Drum_*_macOS_Builder.tar.gz
            UWdeVST_Drum_*_macOS_Builder.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [windows, linux, macos-builder]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --repo "${{ github.repository }}" --generate-notes --title "${{ github.ref_name }}"
